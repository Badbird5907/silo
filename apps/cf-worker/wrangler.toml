name = "silo-worker"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]
workers_dev = false

# R2 bucket for uploads (configure with your bucket name)
[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "silo-uploads"
preview_bucket_name = "silo-uploads-preview"

[[durable_objects.bindings]]
name = "TUS_STATE_DO"
class_name = "TusStateDO"

[[migrations]]
tag = "v1-tus-state-do"
new_sqlite_classes = ["TusStateDO"]

[[queues.producers]]
binding = "DELETE_PREFIX_QUEUE"
queue = "silo-delete-prefix"

[[queues.consumers]]
queue = "silo-delete-prefix"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 5
dead_letter_queue = "silo-delete-prefix-dlq"

[[queues.consumers]]
queue = "silo-delete-prefix-dlq"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 1

[triggers]
crons = ["*/5 * * * *"]

[vars]
WORKER_DOMAIN = "cdn.evanyu.dev"
NEXTJS_CALLBACK_URL = "http://localhost:3000"
TUS_MAX_SIZE = "106300440576"  # 99GB in bytes
# TUS_MAX_PATCH_SIZE = "536870912"  # 512MB per PATCH in bytes
TUS_MAX_PATCH_SIZE = "106300440576"  # 99GB per PATCH in bytes (need to tune!)
TUS_EXPIRATION_HOURS = "24"
EXPIRY_CLEANUP_BATCH_SIZE = "100"
EXPIRY_CLEANUP_MAX_BATCHES = "10"
PENDING_UPLOAD_CLEANUP_BATCH_SIZE = "100"
PENDING_UPLOAD_CLEANUP_MAX_BATCHES = "10"
LIFECYCLE_JOB_BATCH_SIZE = "100"
LIFECYCLE_JOB_MAX_BATCHES = "10"
LIFECYCLE_JOB_LEASE_SECONDS = "60"

# Development environment
[env.development]
name = "silo-worker-dev"
vars.WORKER_DOMAIN = "lvh.me:8787"
vars.NEXTJS_CALLBACK_URL = "http://localhost:3000"
vars.ENV = "development"

# Production environment (override these values)
[env.production]
name = "silo-worker"
vars.WORKER_DOMAIN = "cdn.evanyu.dev"
vars.NEXTJS_CALLBACK_URL = "https://fs.evanyu.dev"  # TODO: Set your production URL
vars.ENV = "production"
vars.TUS_MAX_SIZE = "106300440576"  # 99GB in bytes
vars.TUS_MAX_PATCH_SIZE = "106300440576"  # 99GB per PATCH in bytes (need to tune!)
vars.TUS_EXPIRATION_HOURS = "24"
vars.EXPIRY_CLEANUP_BATCH_SIZE = "100"
vars.EXPIRY_CLEANUP_MAX_BATCHES = "10"
vars.PENDING_UPLOAD_CLEANUP_BATCH_SIZE = "100"
vars.PENDING_UPLOAD_CLEANUP_MAX_BATCHES = "10"
vars.LIFECYCLE_JOB_BATCH_SIZE = "100"
vars.LIFECYCLE_JOB_MAX_BATCHES = "10"
vars.LIFECYCLE_JOB_LEASE_SECONDS = "60"

[[env.production.r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "silo-uploads"
preview_bucket_name = "silo-uploads-preview"

[[env.production.durable_objects.bindings]]
name = "TUS_STATE_DO"
class_name = "TusStateDO"

[[env.production.queues.producers]]
binding = "DELETE_PREFIX_QUEUE"
queue = "silo-delete-prefix"

[[env.production.queues.consumers]]
queue = "silo-delete-prefix"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 5
dead_letter_queue = "silo-delete-prefix-dlq"

[[env.production.queues.consumers]]
queue = "silo-delete-prefix-dlq"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 1

# Secrets (set via: wrangler secret put <NAME>)
# CALLBACK_SECRET - Shared secret for internal API authentication
# SIGNING_SECRET - Secret for signing URLs (must match Next.js)
# VERCEL_AUTOMATION_BYPASS_SECRET - Secret for bypassing Vercel automations
# For development, you can set these in .dev.vars (not committed to git)

[observability]
[observability.logs]
enabled = true
invocation_logs = true
